name: "diag: Cline TUI signals"

# The Cline TUI probe took the whole runner down with SIGTERM ("runner has received a shutdown signal") while qemu
# and timeout survived: the pattern of kill(-1, SIGTERM) from the emulated process. This runs the TUI inside its own
# PID namespace under strace, natively and emulated, and prints every signal it sends.
on:
  workflow_dispatch:
    inputs:
      bun_version:
        default: "1.4.4"
      cline_version:
        default: "3.0.73"

permissions:
  contents: read

env:
  BUN_VERSION: ${{ inputs.bun_version }}

jobs:
  cline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: legacy
      - name: Install the legacy bun
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "bun-v$BUN_VERSION-legacy" -R "$GITHUB_REPOSITORY" -p bun-linux-x64-legacy.zip -D "$RUNNER_TEMP"
          unzip -q -o "$RUNNER_TEMP/bun-linux-x64-legacy.zip" -d "$RUNNER_TEMP"
          mkdir -p "$HOME/.bun/bin"
          install -m755 "$RUNNER_TEMP/bun-linux-x64-legacy/bun" "$HOME/.bun/bin/bun"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/checkout@v4
        with:
          repository: cline/cline
          ref: cli-v${{ inputs.cline_version }}
          path: cline
      - run: for p in legacy/patches/cline/*.patch; do git -C cline apply "$GITHUB_WORKSPACE/$p"; done
      - working-directory: cline
        run: bun install
      - working-directory: cline/apps/cli
        run: bun script/build.ts --single
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user strace >/dev/null
      - name: Same steps as the apps job, on the bare runner, with live signal and memory tracing
        run: |
          set +e -uo pipefail
          c="$GITHUB_WORKSPACE/cline/apps/cli/dist/cli-linux-x64/bin/cline"
          export HOME="$RUNNER_TEMP/home" CLINE_NO_AUTO_UPDATE=1 && mkdir -p "$HOME"
          ( while sleep 10; do echo "[mem $(date +%T)] $(free -m | awk '/Mem:/{print "used="$3"M avail="$7"M"} /Swap:/{print "swap="$3"M"}' | xargs) top: $(ps -eo rss,comm --sort=-rss | sed -n 2,4p | awk '{printf "%s=%dM ", $2, $1/1024}')"; done ) &
          mon=$!
          bash legacy/ci/old-cpus.sh "$c" --version >/dev/null; bash legacy/ci/old-cpus.sh "$c" --help >/dev/null
          ( export CLINE_HUB_PORT=4321 CLINE_DIR="$HOME/.cline" CLINE_DATA_DIR="$HOME/data" CLINE_HUB_DISCOVERY_PATH="$HOME/hub.json"
            setsid --wait qemu-x86_64 -cpu Conroe "$c" hub start; sleep 20
            setsid --wait qemu-x86_64 -cpu Conroe "$c" hub status; setsid --wait qemu-x86_64 -cpu Conroe "$c" hub stop )
          echo "--- processes before the TUI ---"; ps -eo pid,ppid,pgid,sid,user,args | grep -vE '\[|ps -eo' | cut -c1-200
          mkdir -p "$RUNNER_TEMP/proj" && cd "$RUNNER_TEMP/proj"
          echo "runner processes: $(pgrep -f 'Runner.(Listener|Worker)' | xargs)"
          # Every signal the TUI (and anything it starts) sends, printed as it happens. -I3 so strace survives.
          TERM=xterm-256color setsid --wait timeout -k 20 150 script -qefc \
            "stty cols 120 rows 40; exec strace -I3 -f -tt -e trace=kill,tkill,tgkill,pidfd_send_signal,rt_sigqueueinfo,execve -e signal=none -o $RUNNER_TEMP/trace.txt qemu-x86_64 -cpu Conroe $c" /dev/null \
            </dev/zero >"$RUNNER_TEMP/tty.txt" 2>&1 &
          tp=$!
          tail -F "$RUNNER_TEMP/trace.txt" 2>/dev/null | grep --line-buffered -vE 'SIGPWR|, 0\) ' | cut -c1-260 &
          wait $tp; echo "TUI probe exit $?"
          sleep 2; kill $mon
          tr -d '\033' < "$RUNNER_TEMP/tty.txt" | sed 's/\[[0-9;?]*[a-zA-Z]//g' | tr -s ' \n' | tail -c 800; echo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cline-strace
          path: ${{ runner.temp }}/*.txt
